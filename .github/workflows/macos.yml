name: Build macOS app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Build and test on macOS
        run: bash build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramLinks-macOS-${{ matrix.architecture }}
          path: dist/TelegramLinks-macOS-*.zip
          if-no-files-found: error
