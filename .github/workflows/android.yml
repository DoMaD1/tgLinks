name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android_app/**', 'links.py', 'scanner.py', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake autopoint gettext
          pip install buildozer==1.6.0 'Cython==0.29.34' setuptools -r requirements.txt
      - name: Test shared logic
        run: python -m unittest discover -s tests -v
      - name: Prepare shared modules
        run: cp links.py scanner.py android_app/
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android_app/.buildozer
          key: android-build-v1-${{ hashFiles('android_app/buildozer.spec') }}
      - name: Build APK
        working-directory: android_app
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramLinks-Android
          path: android_app/bin/*.apk
          if-no-files-found: error
